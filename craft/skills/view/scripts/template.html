<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>craft view</title>
<style>
:root {
  --bg: #f6f6f3; --card: #ffffff; --fg: #1c1c1a; --muted: #6b6b66; --border: #e2e1dc; --accent: #2f5bd3;
  --red: #b42318; --red-bg: #fdeceb; --yellow: #946200; --yellow-bg: #fff3d1; --green: #17703f; --green-bg: #e2f4e8;
  --blue-bg: #e8eefc; --add: #e6f6ea; --del: #fdecec; --focus: #fff1b8; --code: #f1f0ec;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151514; --card: #1e1e1c; --fg: #ecebe6; --muted: #9a9993; --border: #33322f; --accent: #8aaeff;
    --red: #ff8a80; --red-bg: #3b1d1a; --yellow: #f0be55; --yellow-bg: #3a2e12; --green: #66d394; --green-bg: #15301f;
    --blue-bg: #1c2742; --add: #143020; --del: #3a1b1b; --focus: #403813; --code: #262624;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
main { max-width: 1060px; margin: 0 auto; padding: 28px 16px 96px; }
a { color: var(--accent); }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
:not(pre) > code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
.top { margin-bottom: 20px; }
.kicker { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--muted); font-weight: 600; }
h1 { font-size: 26px; line-height: 1.25; margin: 4px 0 10px; }
h2 { font-size: 17px; margin: 0; display: inline-flex; align-items: center; gap: 8px; }
h3 { font-size: 15px; margin: 18px 0 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--code); color: var(--fg); white-space: nowrap; }
.pill.red { background: var(--red-bg); color: var(--red); } .pill.yellow { background: var(--yellow-bg); color: var(--yellow); }
.pill.green { background: var(--green-bg); color: var(--green); } .pill.chip { background: var(--blue-bg); color: var(--accent); }
.pill.big { font-size: 14px; padding: 4px 14px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; }
.brief { border-left: 4px solid var(--accent); margin-bottom: 18px; }
.brief h2 { margin-bottom: 6px; }
details.section { margin: 14px 0; }
details.section > summary { cursor: pointer; list-style: none; padding: 6px 0; }
details.section > summary::-webkit-details-marker { display: none; }
details.section > summary h2::before { content: "▸"; color: var(--muted); font-size: 13px; transition: transform .15s; display: inline-block; }
details.section[open] > summary h2::before { transform: rotate(90deg); }
.count { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--code); border-radius: 999px; padding: 0 8px; }
.nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.nav a { text-decoration: none; }
.triggers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.items { display: grid; gap: 12px; }
.item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
.item.red { border-left: 4px solid var(--red); } .item.yellow { border-left: 4px solid var(--yellow); } .item.green { border-left: 4px solid var(--green); }
.item-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.id { font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
.loc { font-size: 13px; }
.what { font-weight: 600; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 8px 0 0; }
dl.facts dt { color: var(--muted); font-size: 13px; } dl.facts dd { margin: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.cards .item { padding: 10px 14px; }
.consequence { margin-top: 6px; font-size: 14px; color: var(--muted); }
.consequence::before { content: "→ "; }
.excerpt { margin-top: 10px; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
table.diff { border-collapse: collapse; width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
table.diff td { padding: 0 8px; white-space: pre; vertical-align: top; }
table.diff tr.hdr td { background: var(--code); color: var(--muted); padding: 3px 8px; }
table.diff td.ln { color: var(--muted); text-align: right; user-select: none; width: 1%; }
table.diff tr.tadd td.code { background: var(--add); } table.diff tr.tdel td.code { background: var(--del); }
table.diff tr.focus td.ln { background: var(--focus); color: var(--fg); font-weight: 600; }
table.diff tr.far { display: none; } table.diff.full tr.far { display: table-row; }
table.diff tr.toggle { cursor: pointer; } table.diff .more { color: var(--accent); margin-left: 8px; }
table.grid { border-collapse: collapse; width: 100%; font-size: 14px; }
table.grid th, table.grid td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.grid th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.md table { border-collapse: collapse; margin: 8px 0; } .md th, .md td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
.md pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
pre.mermaid { background: transparent; text-align: center; margin: 0; }
.diagram { overflow-x: auto; }
.note { background: var(--yellow-bg); color: var(--yellow); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
.lede { font-size: 16px; color: var(--muted); margin: 0 0 6px; }
.flow + .flow { margin-top: 18px; }
.timeline { position: relative; margin: 4px 0 0 6px; padding-left: 22px; border-left: 2px solid var(--border); }
.wp { position: relative; padding: 0 0 18px; }
.wp:last-child { padding-bottom: 2px; }
.wp::before { content: ""; position: absolute; left: -30px; top: 5px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--card); }
.wp.old::before { background: var(--muted); }
.wp.old .wp-title { color: var(--muted); text-decoration: line-through; }
.wp-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.wp-date { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
.wp-title { font-weight: 600; }
.branch { display: flex; gap: 8px; align-items: baseline; margin: 3px 0 0 6px; font-size: 13px; }
.branch::before { content: ""; flex: none; width: 18px; border-top: 1.5px dashed var(--muted); transform: translateY(-3px); }
.branch .no { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); }
footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
@media (max-width: 640px) { h1 { font-size: 21px; } dl.facts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import { marked } from "https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js";
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs";

const P = /*__PAYLOAD__*/null;
const app = document.getElementById("app");
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });

// ---------- helpers ----------
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}
const md = (src) => h("div", { class: "md", html: marked.parse(src || "") });
const pill = (text, tone = "") => h("span", { class: `pill ${tone}` }, text);
const card = (...kids) => h("div", { class: "card" }, ...kids);
const diagram = (src) => src ? h("div", { class: "diagram" }, h("pre", { class: "mermaid" }, src)) : null;
const TONE = { red: "red", yellow: "yellow", green: "green", high: "red", medium: "yellow", low: "", confirmed: "red",
  plausible: "yellow", pass: "green", fail: "red", "not-run": "yellow", accept: "green", change: "red", discuss: "yellow",
  draft: "yellow", ready: "green", "in-progress": "chip", blocked: "red", done: "green" };
const tone = (v) => TONE[String(v || "").toLowerCase()] || "";
// Contract kinds that get extra emphasis: data model and public API changes outlive the code.
const DATA_KINDS = new Set(["schema", "data-writer", "data-copy"]);
const API_KINDS = new Set(["api", "event"]);
const isDataOrApi = (kind) => DATA_KINDS.has(kind) || API_KINDS.has(kind);
const COMPAT = { compatible: "green", breaking: "red", "needs-migration": "yellow", "needs-versioning": "yellow" };
const TIER = { red: "🔴 red — walkthrough required", yellow: "🟡 yellow — skim the flagged items", green: "🟢 green — no triggers" };

function section(title, count, body, { open = true, id } = {}) {
  return h("details", { class: "section", open, id },
    h("summary", {}, h("h2", {}, title, count != null ? h("span", { class: "count" }, count) : null)), body);
}
function editorHref(file, line) {
  if (!P.repo || P.editor === "none") return null;
  const abs = `${P.repo}/${file}`;
  if (P.editor === "idea") return `idea://open?file=${encodeURIComponent(abs)}&line=${line}`;
  return `${P.editor}://file${abs}:${line}`;
}
function loc(where) {
  if (!where) return null;
  const m = /^(.+?):(\d+)(?:-(\d+))?$/.exec(where);
  const href = m ? editorHref(m[1], m[2]) : null;
  return href ? h("a", { class: "loc mono", href, title: `Open in ${P.editor}` }, where) : h("code", { class: "loc" }, where);
}
function verdict(id) {
  const v = P.review?.verdicts?.[id];
  return v ? pill(`verdict: ${v}`, tone(v)) : null;
}
const NEAR = 4; // lines shown around the focus before "show full hunk"
function excerptView(x) {
  if (!x) return null;
  if (x.kind === "missing") return h("div", { class: "muted small" }, `${x.file}: not found at head`);
  const [a, b] = x.focus || [-Infinity, Infinity];
  return h("div", { class: "excerpt" }, x.hunks.map((hk) => {
    let lastN = 0, hidden = 0;
    const rows = hk.lines.map((l) => {
      lastN = l.n ?? lastN;
      const kind = l.t === "+" ? "tadd" : l.t === "-" ? "tdel" : "tctx";
      const focus = x.focus && l.n != null && l.n >= a && l.n <= b ? " focus" : "";
      const far = lastN < a - NEAR || lastN > b + NEAR ? " far" : "";
      hidden += far ? 1 : 0;
      return h("tr", { class: kind + focus + far },
        h("td", { class: "ln" }, l.o ?? ""), h("td", { class: "ln" }, l.n ?? ""),
        h("td", { class: "code" }, `${l.t === " " ? " " : l.t} ${l.s}`));
    });
    const table = h("table", { class: "diff" });
    const more = hidden ? h("span", { class: "more" }, `show full hunk (+${hidden} lines)`) : null;
    const hdr = h("tr", { class: `hdr${hidden ? " toggle" : ""}` }, h("td", { colspan: 3 }, hk.header, " ", more));
    if (hidden) hdr.addEventListener("click", () => {
      const full = table.classList.toggle("full");
      more.textContent = full ? "show focus only" : `show full hunk (+${hidden} lines)`;
    });
    table.append(hdr, ...rows);
    return table;
  }));
}
function facts(pairs) {
  const rows = pairs.filter(([, v]) => v);
  return rows.length ? h("dl", { class: "facts" }, rows.map(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])) : null;
}
function header(kicker, title, ...meta) {
  app.append(h("header", { class: "top" }, h("div", { class: "kicker" }, kicker), h("h1", {}, title), h("div", { class: "meta" }, meta)));
}
// Mermaid blocks written in markdown become diagrams.
function upgradeMermaid(root) {
  for (const code of root.querySelectorAll("pre > code.language-mermaid")) {
    code.parentElement.replaceWith(h("pre", { class: "mermaid" }, code.textContent));
  }
}

// ---------- spec ----------
// "- **Contract changes:**" with nested "C1 kind: what — consequence" items → cards.
function liftContracts(root) {
  let list = null, anchor = null;
  for (const li of root.querySelectorAll("li")) {
    const s = li.querySelector(":scope > strong, :scope > p > strong");
    if (s && /^contract changes/i.test(s.textContent)) { list = li.querySelector("ul, ol"); anchor = li; break; }
  }
  if (!list) {
    for (const hd of root.querySelectorAll("h3, h4")) {
      if (/contract changes/i.test(hd.textContent) && hd.nextElementSibling?.matches("ul, ol")) {
        list = hd.nextElementSibling; anchor = hd; break;
      }
    }
  }
  if (!list) return;
  const cards = [...list.children].map((li) => {
    const m = /^\s*(C\d+)\s+([\w-]+)\s*:/.exec(li.textContent);
    const kind = m ? m[2].toLowerCase() : "";
    const body = m ? li.innerHTML.replace(/^\s*(<strong>)?\s*C\d+\s+[\w-]+\s*:\s*(<\/strong>)?\s*/, "") : li.innerHTML;
    const [what, ...rest] = body.split(/\s+—\s+/);
    const el = h("div", { class: `item ${isDataOrApi(kind) ? "red" : "yellow"}` },
      h("div", { class: "item-head" }, m ? h("span", { class: "id" }, m[1]) : null, m ? pill(kind, "chip") : null),
      h("div", { class: "what", html: what }),
      rest.length ? h("div", { class: "consequence", html: rest.join(" — ") }) : null);
    return { kind, el };
  });
  anchor.remove();
  const key = cards.filter((c) => isDataOrApi(c.kind)), other = cards.filter((c) => !isDataOrApi(c.kind));
  if (key.length) root.append(h("h3", {}, "Data model & API changes"), h("div", { class: "cards" }, key.map((c) => c.el)));
  if (other.length) root.append(h("h3", {}, key.length ? "Other contract changes" : "Contract changes"),
    h("div", { class: "cards" }, other.map((c) => c.el)));
}

function renderSpec() {
  const fm = P.frontmatter || {};
  header("Spec review", P.title || P.file,
    fm.status && pill(fm.status, tone(fm.status)), (P.targets || []).map((t) => pill(t, "chip")),
    fm.created && h("span", { class: "muted small" }, `created ${fm.created}`),
    fm.updated && h("span", { class: "muted small" }, `updated ${fm.updated}`));

  const brief = P.sections.find((s) => /review brief/i.test(s.title));
  if (brief) {
    const body = md(brief.md);
    liftContracts(body);
    app.append(h("section", { class: "card brief" }, h("h2", {}, "Review brief"), body));
  }
  if (P.diagram) {
    app.append(section("Affected components", null,
      card(diagram(P.diagram), h("p", { class: "muted small" }, "Highlighted: the spec's target components. Arrows: allowed dependencies from ARCHITECTURE.md."))));
  }
  for (const s of P.sections.filter((x) => x !== brief)) {
    const key = /verification|acceptance|open question|contract|migration/i.test(s.title);
    app.append(section(s.title || "Notes", null, card(md(s.md)), { open: key }));
  }
  app.append(h("footer", {}, P.file));
}

// ---------- change ----------
function renderChange() {
  const r = { ...(P.review || {}) };
  const allContracts = r.contracts || [];
  const keyContracts = allContracts.filter((c) => isDataOrApi(c.kind));
  r.contracts = allContracts.filter((c) => !isDataOrApi(c.kind));
  const tf = P.trigger_files || {};
  const dataFiles = tf.schema || [], apiFiles = [...(tf.api || []), ...(tf.event || [])];
  r["data-api"] = keyContracts.length || dataFiles.length || apiFiles.length ? [...keyContracts] : [];
  const groups = [
    ["data-api", "Data model & API"], ["deviations", "Deviations from spec"], ["contracts", "Other contract changes"],
    ["findings", "Findings"], ["blast", "Blast radius"],
  ].filter(([k]) => (r[k] || []).length || (k === "data-api" && (dataFiles.length || apiFiles.length)));

  header("Change review", P.title,
    pill(TIER[r.tier] || r.tier || "tier: n/a", `big ${tone(r.tier)}`),
    P.base && h("span", { class: "mono muted" }, `${P.base}..${P.head}`),
    h("span", { class: "muted small" }, `${(P.files || []).length} files`));

  if ((r.triggers || []).length) {
    app.append(h("div", { class: "card" }, h("div", { class: "kicker" }, "Why this tier"),
      h("div", { class: "triggers" }, r.triggers.map((t) => typeof t === "string" ? pill(t, tone(r.tier)) : pill(t.what, tone(t.tier))))));
  }
  for (const n of P.notes || []) app.append(h("div", { class: "note" }, n));
  if (groups.length) {
    app.append(h("nav", { class: "nav" }, h("span", { class: "muted small" }, "Walk order:"),
      groups.map(([k, title]) => h("a", { href: `#${k}` }, pill(`${title} · ${r[k].length}`, k === "data-api" ? "red" : "")))));
  }
  if (P.spec?.brief) {
    app.append(section("Spec brief", null, card(md(P.spec.brief)), { open: false }));
  }

  const deviation = (d) => h("div", { class: "item red" },
    h("div", { class: "item-head" }, h("span", { class: "id" }, d.id), pill("deviation", "red"), loc(d.where), verdict(d.id)),
    h("div", { class: "what" }, d.what), excerptView(P.excerpts[d.id]));

  const contract = (c) => h("div", { class: "item red" },
    h("div", { class: "item-head" }, h("span", { class: "id" }, c.id), pill(c.kind || "contract", "chip"),
      c.compat && pill(c.compat, COMPAT[c.compat] || ""), c.migration && pill(`migration: ${c.migration}`),
      loc(c.where), verdict(c.id)),
    h("div", { class: "what" }, c.what), c.consequence && h("div", { class: "consequence" }, c.consequence),
    excerptView(P.excerpts[c.id]));

  // Contracts plus the schema/API files the diff actually touched (from trigger globs), so a change
  // the review failed to report still shows up.
  const fileList = (files) => h("div", { class: "small" }, files.map((f) => h("div", {}, loc(`${f}:1`) || f)));
  const keyGroup = (title, kinds, files) => {
    const cs = keyContracts.filter((c) => kinds.has(c.kind));
    if (!cs.length && !files.length) return null;
    const unreported = files.length > 0 && cs.length === 0;
    const shown = new Set(cs.map((c) => P.excerpts[c.id]?.file));
    return h("div", {}, h("h3", {}, title),
      unreported && h("div", { class: "note" },
        `${files.length} changed file(s) match the ${title} triggers, but the review reports no ${title} change — check before approving.`),
      h("div", { class: "items" }, cs.map(contract)),
      files.length ? h("div", { class: "card", style: "margin-top:10px" }, h("div", { class: "kicker" }, "Changed files"), fileList(files),
        files.filter((f) => P.file_diffs?.[f] && !shown.has(f)).map((f) => excerptView(P.file_diffs[f]))) : null);
  };
  const dataApi = () => h("div", {}, keyGroup("Data model", DATA_KINDS, dataFiles), keyGroup("API", API_KINDS, apiFiles));

  const rank = (f) => (f.status === "confirmed" ? 0 : 3) + ({ high: 0, medium: 1, low: 2 }[f.severity] ?? 2);
  const finding = (f) => h("div", { class: `item ${tone(f.status === "confirmed" ? "confirmed" : f.severity)}` },
    h("div", { class: "item-head" }, h("span", { class: "id" }, f.id), pill(f.severity || "?", tone(f.severity)),
      pill(f.status || "plausible", tone(f.status)), loc(f.where), verdict(f.id)),
    facts([["Invariant", f.invariant], ["Scenario", f.scenario], ["Consequence", f.consequence], ["Fix", f.fix],
      ["Test", f.test && h("code", {}, f.test)]]),
    excerptView(P.excerpts[f.id]));

  const blast = (b) => h("div", { class: `item ${(b.covered_by || []).length ? "" : "yellow"}` },
    h("div", { class: "item-head" }, h("span", { class: "id" }, b.id), h("code", {}, b.symbol), loc(b.where), verdict(b.id)),
    h("div", {}, b.change),
    facts([["Callers", (b.callers || []).length && h("div", {}, b.callers.map((c) => h("div", {}, loc(c))))],
      ["Covered by", (b.covered_by || []).length ? b.covered_by.map((t) => h("div", {}, h("code", {}, t))) : pill("no covering test", "yellow")]]),
    excerptView(P.excerpts[b.id]));

  const render = { deviations: deviation, contracts: contract, findings: finding, blast };
  for (const [k, title] of groups) {
    if (k === "data-api") {
      app.append(section(title, r[k].length || null, dataApi(), { id: k }));
      continue;
    }
    const list = k === "findings" ? [...r[k]].sort((a, b) => rank(a) - rank(b)) : r[k];
    app.append(section(title, list.length, h("div", { class: "items" }, list.map(render[k])), { id: k }));
  }

  if (P.diagram) {
    const edges = r.new_edges || [];
    app.append(section("Architecture impact", edges.length ? `${edges.length} new edge${edges.length > 1 ? "s" : ""}` : null,
      card(diagram(P.diagram), h("p", { class: "muted small" },
        "Highlighted: components this diff touches. Red dashed: dependencies not allowed by ARCHITECTURE.md today."))));
  }

  if ((r.evidence || []).length) {
    app.append(section("Acceptance evidence", r.evidence.length, card(h("table", { class: "grid" },
      h("tr", {}, h("th", {}, "AC"), h("th", {}, "Test"), h("th", {}, "Result")),
      r.evidence.map((e) => h("tr", {}, h("td", { class: "id" }, e.ac), h("td", {}, e.test ? h("code", {}, e.test) : h("span", { class: "muted" }, "manual")),
        h("td", {}, pill(e.result || "not-run", tone(e.result)))))))));
  }
  if ((r.not_checked || []).length) {
    app.append(section("Not checked", r.not_checked.length,
      h("div", { class: "card" }, h("ul", {}, r.not_checked.map((n) => h("li", {}, n))))));
  }
  if ((P.files || []).length) {
    const byComp = {};
    for (const f of P.files) (byComp[f.component || "(outside the model)"] ||= []).push(f);
    app.append(section("Files changed", P.files.length, card(Object.entries(byComp).map(([comp, files]) =>
      h("div", {}, h("h3", {}, comp), files.map((f) =>
        h("div", { class: "mono small" }, pill(f.status, f.status === "A" ? "green" : f.status === "D" ? "red" : ""), " ", f.path))))),
      { open: false }));
  }
  app.append(h("footer", {}, P.spec?.file || ""));
}

// ---------- model ----------
function renderModel() {
  const counts = [`${P.components.length} components`, `${P.entities.length} entities`, `${P.decisions.length} decisions`];
  header("Architecture", P.title, h("span", { class: "muted small" }, counts.join(" · ")));
  if (P.does) app.querySelector(".top").append(h("p", { class: "lede" }, P.does));
  for (const p of P.problems || []) app.append(h("div", { class: "note" }, p));
  const caption = (text) => h("p", { class: "muted small" }, text);
  if (P.context) app.append(section("Context", null, card(diagram(P.context),
    caption("Rounded: who calls the system. Edge labels: the component on our side."))));
  if (P.diagram) app.append(section("Decomposition", P.components.length, card(diagram(P.diagram),
    caption("Arrows: allowed dependencies — anything else fails the build."))));
  if (P.entity_diagram) app.append(section("Entities", P.entities.length, card(diagram(P.entity_diagram),
    caption("Boxes: the owning component — the only writer. Dashed: reference by id. Orange: a copy of someone else's data. ⟳: has a lifecycle below."))));
  if (P.lifecycles.length) app.append(section("Lifecycles", P.lifecycles.length, card(
    P.lifecycles.map((l) => h("div", { class: "flow" }, h("h3", {}, l.entity), diagram(l.diagram))))));
  if (P.flow_diagrams.length) app.append(section("Main flows", P.flow_diagrams.length, card(
    P.flow_diagrams.map((f) => h("div", { class: "flow" }, h("h3", {}, f.title), diagram(f.diagram))),
    caption("Solid: call. Open arrow: async message."))));
  if (P.decisions.length) {
    const undated = (slug) => slug.replace(/^\d{4}-\d{2}-\d{2}-/, "");
    const branch = (r) => h("div", { class: "branch" }, h("span", { class: "no" }, r.what), r.why && h("span", { class: "muted" }, r.why));
    const waypoint = (d) => h("div", { class: `wp${d.superseded_by ? " old" : ""}` },
      h("div", { class: "wp-head" }, h("span", { class: "wp-date" }, d.date),
        h("a", { class: "wp-title", href: editorHref(d.file, 1) || d.file }, d.title),
        d.superseded_by && pill(`superseded by ${undated(d.superseded_by)}`, "yellow"),
        d.supersedes.length > 0 && pill(`replaces ${d.supersedes.map(undated).join(", ")}`, "chip")),
      d.rejected.map(branch));
    app.append(section("Decisions", P.decisions.length, card(h("div", { class: "timeline" }, P.decisions.map(waypoint)),
      caption("Oldest first. Side branches: options considered and rejected."))));
  }
  const codes = (xs) => xs.map((x) => h("div", {}, h("code", {}, x)));
  const owned = (c) => P.entities.filter((e) => e.owner === c.name).map((e) => e.name).join(", ");
  if (P.components.length) {
    app.append(section("Components", P.components.length, card(h("table", { class: "grid" },
      h("tr", {}, ["Component", "Does", "Path", "May depend on", "Owns"].map((t) => h("th", {}, t))),
      P.components.map((c) => h("tr", {}, h("td", { class: "what" }, c.name), h("td", { class: "small" }, c.does),
        h("td", {}, codes(c.paths)), h("td", {}, c.deps.join(", ")), h("td", {}, owned(c)))))), { open: false }));
  }
  if (P.rules.length) {
    app.append(section("Rules", P.rules.length, card(h("table", { class: "grid" },
      h("tr", {}, ["ID", "Level", "Scope", "Rule", "Enforced by", "Exceptions"].map((t) => h("th", {}, t))),
      P.rules.map((r) => h("tr", {}, h("td", { class: "id" }, r.id), h("td", {}, pill(r.level, r.level === "MUST" ? "chip" : "")),
        h("td", {}, codes(r.scope)), h("td", { html: marked.parseInline(String(r.text)) }),
        h("td", {}, r.checker ? h("code", {}, r.checker) : pill("manual", "yellow")),
        h("td", { class: "muted small" }, r.exceptions))))), { open: false }));
  }
  if (Object.keys(P.triggers || {}).length) {
    app.append(section("Review triggers", null, card(h("table", { class: "grid" },
      h("tr", {}, h("th", {}, "Trigger"), h("th", {}, "Paths")),
      Object.entries(P.triggers).map(([k, globs]) => h("tr", {}, h("td", { class: "what" }, k), h("td", {}, codes(globs)))))), { open: false }));
  }
  app.append(h("footer", {}, P.file));
}

({ spec: renderSpec, change: renderChange, model: renderModel })[P.kind]();
document.title = `${P.kind}: ${P.title || "craft"}`;
upgradeMermaid(app);
// One render per diagram with our own ids: mermaid.run derives ids from the clock, and same-tick ids collide.
let seq = 0;
for (const pre of app.querySelectorAll("pre.mermaid")) {
  try {
    pre.innerHTML = (await mermaid.render(`diagram-${seq++}`, pre.textContent)).svg;
  } catch (e) {
    pre.replaceWith(h("div", { class: "note" }, `Diagram error: ${e.message || e}`));
  }
}
</script>
</body>
</html>
