<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --ink: #1d1f23; --muted: #6b7079; --line: #e3e4e8;
  --accent: #2f6fde; --accent-soft: #e8f0fd; --warn: #b26b00; --warn-soft: #fff4e0;
  --bad: #c2362f; --bad-soft: #fdecea; --ok: #2e7d4f; --ok-soft: #e7f5ec; --chip: #f1f2f4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171b; --panel: #1d2026; --ink: #e6e7ea; --muted: #9aa0aa; --line: #30343c;
    --accent: #6ea1ff; --accent-soft: #1f2b40; --warn: #f0b552; --warn-soft: #3a2e17;
    --bad: #ff7b72; --bad-soft: #3b1e1d; --ok: #6fcf97; --ok-soft: #17321f; --chip: #2a2e35;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header { padding: 28px 32px 8px; max-width: 1280px; margin: 0 auto; }
header h1 { margin: 0 0 4px; font-size: 26px; }
header .summary { color: var(--muted); max-width: 900px; margin: 0 0 12px; }
nav { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
nav div { max-width: 1280px; margin: 0 auto; padding: 8px 32px; display: flex; gap: 18px; flex-wrap: wrap; }
nav a { color: var(--muted); font-weight: 500; }
main { max-width: 1280px; margin: 0 auto; padding: 0 32px 64px; }
section { margin-top: 36px; }
h2 { font-size: 18px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
h3 { font-size: 15px; margin: 0 0 6px; }
.muted { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
.chip b { font-weight: 600; color: var(--muted); margin-right: 4px; }
.badge { border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .03em; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.must { background: var(--bad-soft); color: var(--bad); }
.badge.should { background: var(--warn-soft); color: var(--warn); }
.badge.current { background: var(--ok-soft); color: var(--ok); }
.badge.superseded { background: var(--chip); color: var(--muted); }
.counts { color: var(--muted); margin: 10px 0 0; }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 6px 6px 0; padding: 6px 10px; margin: 8px 0; }
.note .about { color: var(--muted); font-size: 12px; margin-top: 2px; }
.problems { border-radius: 8px; padding: 10px 14px; margin: 14px 0 0; background: var(--bad-soft); }
.problems.warn { background: var(--warn-soft); }
.problems ul { margin: 4px 0 0; padding-left: 18px; }
.diagram { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  overflow-x: auto; text-align: center; }
.diagram svg { max-width: 100%; height: auto; }
.diagram.wide svg { max-width: none; }
.legend { color: var(--muted); font-size: 12px; margin-top: 6px; }
.diag-error { color: var(--bad); text-align: left; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.card .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.card .head h3 { margin: 0; }
.card ul.does { margin: 4px 0 8px; padding-left: 18px; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 3px 10px; margin-top: 8px; font-size: 13px; }
.kv > dt { color: var(--muted); }
.kv > dd { margin: 0; }
.modules { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.module { margin: 6px 0; }
table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; background: var(--chip); }
tr:last-child td { border-bottom: 0; }
.store { margin-top: 18px; }
.store .meta { color: var(--muted); margin: 0 0 6px; }
.two { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
dl.glossary { display: grid; grid-template-columns: 200px 1fr; gap: 6px 16px; margin: 0; }
dl.glossary dt { font-weight: 600; }
dl.glossary dd { margin: 0; color: var(--muted); }
/* decision timeline */
.timeline { list-style: none; margin: 0; padding: 0 0 0 22px; border-left: 2px solid var(--line); }
.adr { position: relative; margin: 0 0 22px; padding-left: 14px; }
.adr::before { content: ""; position: absolute; left: -31px; top: 5px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--ok); border: 3px solid var(--bg); }
.adr.superseded::before { background: var(--muted); }
.adr.superseded .title { text-decoration: line-through; color: var(--muted); }
.adr .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.adr time { color: var(--muted); font-variant-numeric: tabular-nums; }
.adr .title { font-weight: 600; font-size: 15px; color: var(--ink); }
.adr .decision { margin: 4px 0 0; max-width: 900px; }
.adr .rel { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.branches { list-style: none; margin: 6px 0 0; padding: 0 0 0 4px; }
.branches li { position: relative; padding: 2px 0 2px 34px; color: var(--muted); font-size: 13px; }
.branches li::before { content: ""; position: absolute; left: 0; top: -4px; width: 24px; height: 16px;
  border-left: 2px dashed var(--line); border-bottom: 2px dashed var(--line); border-bottom-left-radius: 8px; }
.branches .opt { color: var(--bad); text-decoration: line-through; font-weight: 500; }
.branches .revisit { color: var(--warn); }
/* spec page and changes view */
.narrow { max-width: 1060px; }
header.narrow, main.narrow, footer.narrow { margin-left: auto; margin-right: auto; }
main.narrow { padding-top: 12px; }
footer.narrow { color: var(--muted); font-size: 12px; padding: 0 32px 32px; }
.kicker { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--chip); white-space: nowrap; }
.pill.red { background: var(--bad-soft); color: var(--bad); }
.pill.yellow { background: var(--warn-soft); color: var(--warn); }
.pill.green { background: var(--ok-soft); color: var(--ok); }
.pill.chip { background: var(--accent-soft); color: var(--accent); }
.pill.big { font-size: 14px; padding: 4px 14px; }
.brief { border-left: 4px solid var(--accent); margin-bottom: 18px; }
.walk { margin: 14px 0 0; }
.walk a:hover { text-decoration: none; }
details.section { margin: 18px 0; }
details.section > summary { cursor: pointer; }
details.section > summary h2 { display: inline; border: 0; }
.count { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 0 8px; }
.items { display: grid; gap: 12px; margin-top: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.item.red { border-left: 4px solid var(--bad); }
.item.yellow { border-left: 4px solid var(--warn); }
.item.green { border-left: 4px solid var(--ok); }
.item-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.id { font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
.what { font-weight: 600; }
.consequence { margin-top: 6px; color: var(--muted); }
.consequence::before { content: "→ "; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 8px 0 0; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; }
.excerpt { margin-top: 10px; overflow-x: auto; }
.excerpt summary { cursor: pointer; color: var(--accent); font-size: 12.5px; margin: 4px 0; }
table.diff { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; border-radius: 8px; margin-top: 4px; }
table.diff td { padding: 0 8px; white-space: pre; border: 0; }
table.diff tr.hdr td { background: var(--chip); color: var(--muted); padding: 3px 8px; }
table.diff td.ln { color: var(--muted); text-align: right; user-select: none; width: 1%; }
table.diff tr.tadd td.code { background: var(--ok-soft); }
table.diff tr.tdel td.code { background: var(--bad-soft); }
table.diff tr.focus td.ln { background: var(--warn-soft); color: var(--ink); font-weight: 600; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md pre { background: var(--chip); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.md :not(pre) > code { background: var(--chip); padding: 1px 5px; border-radius: 4px; }
.md table { margin: 8px 0; }
@media (max-width: 640px) { header, main, footer.narrow { padding-left: 16px; padding-right: 16px; } dl.facts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
{{BODY}}
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict",
  flowchart: { htmlLabels: true, curve: "basis" }, sequence: { mirrorActors: false } });
let n = 0;
for (const el of document.querySelectorAll("pre.mermaid")) {
  const code = el.textContent;
  try {
    const { svg } = await mermaid.render("m" + n++, code);
    el.outerHTML = svg;
  } catch (e) {
    const pre = document.createElement("pre");
    pre.textContent = code;
    el.outerHTML = `<div class="diag-error">Diagram error: ${String(e.message || e).replace(/</g, "&lt;")}</div>` + pre.outerHTML;
  }
}
</script>
</body>
</html>
